# Render Blueprint for PinkPill: https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → pick this repository (and the branch with the pinkpill/ app).
# Creates the web app and a PostgreSQL database, wired together.
services:
  - type: web
    name: pinkpill
    runtime: node
    plan: free
    rootDir: pinkpill
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/auth/session
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: pinkpill-db
          property: connectionString
      - key: TRUST_PROXY
        value: "1"
      # Secret used once at /#/claim-admin to make your account the super administrator.
      # Copy it from the service's Environment tab, then delete it after claiming.
      - key: ADMIN_CLAIM_TOKEN
        generateValue: true
      # Email: until you add SMTP_URL + MAIL_FROM and set MAIL_TRANSPORT=smtp, emails are only
      # written to the logs, so verification is off. Turn REQUIRE_EMAIL_VERIFICATION on after SMTP works.
      - key: MAIL_TRANSPORT
        value: console
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Set to https://your-domain once you attach a custom domain (defaults to the onrender.com URL).
      - key: APP_URL
        sync: false
databases:
  - name: pinkpill-db
    plan: free
    databaseName: pinkpill
    user: pinkpill
