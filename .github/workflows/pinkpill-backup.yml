# Optional weekly database backup to a PRIVATE Cloudflare R2 bucket.
# Runs only when these repository secrets exist (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL        Neon connection string (the direct one, not the -pooler one)
#   R2_ACCOUNT_ID, R2_BACKUP_ACCESS_KEY_ID, R2_BACKUP_SECRET_ACCESS_KEY, R2_BACKUP_BUCKET
#   BACKUP_PASSPHRASE          encrypts the dump (AES-256) before upload
# This repository is public: the workflow never prints the dump or any secret.
name: PinkPill backup
on:
  schedule:
    - cron: '17 3 * * 0'     # Sundays 03:17 UTC
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HAS_SECRETS: ${{ secrets.BACKUP_DATABASE_URL != '' && secrets.R2_BACKUP_BUCKET != '' && secrets.BACKUP_PASSPHRASE != '' }}
    steps:
      - name: Skip when not configured
        if: env.HAS_SECRETS != 'true'
        run: echo "Backup secrets are not configured; skipping."
      - name: Install PostgreSQL 17 client (dumps 16 and 17 servers)
        if: env.HAS_SECRETS == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 >/dev/null
      - name: Dump, encrypt, upload
        if: env.HAS_SECRETS == 'true'
        env:
          DB: ${{ secrets.BACKUP_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          FILE="pinkpill-$(date -u +%Y%m%dT%H%M%SZ).dump"
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner --no-privileges --file "$FILE" "$DB"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$FILE" -out "$FILE.enc" -pass env:PASS
          aws s3 cp "$FILE.enc" "s3://$BUCKET/backups/$FILE.enc" --endpoint-url "$ENDPOINT" --only-show-errors
          echo "Uploaded backups/$FILE.enc ($(stat -c %s "$FILE.enc") bytes)"
          rm -f "$FILE" "$FILE.enc"
